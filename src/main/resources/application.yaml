spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false


  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_APP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8081
  address: 0.0.0.0
  servlet:
    context-path: /api

springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    try-it-out-enabled: true
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS}

auth:
  seed-default-users: ${AUTH_SEED_DEFAULT_USERS}
  admin:
    name: ${AUTH_ADMIN_NAME}
    email: ${AUTH_ADMIN_EMAIL}
    password: ${AUTH_ADMIN_PASSWORD}
  gestor:
    name: ${AUTH_GESTOR_NAME}
    email: ${AUTH_GESTOR_EMAIL}
    password: ${AUTH_GESTOR_PASSWORD}

logging:
  level:
    com.contract_management: DEBUG